version: '3.9'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bothubpro
      POSTGRES_USER: bothubpro
      POSTGRES_PASSWORD: bothubpro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bothubpro"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://bothubpro:bothubpro@db:5432/bothubpro
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-BotHubProDevKey2024SecretMin32Ch}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@bothubpro.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-YourBotHubProBot}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:3000","http://localhost:3001"]}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - bot_files:/app/bot_files
      - trade_data:/data
    command: >
      sh -c "alembic upgrade head && python scripts/seed_admin.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://bothubpro:bothubpro@db:5432/bothubpro
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-BotHubProDevKey2024SecretMin32Ch}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - trade_data:/data
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - worker
    command: celery -A app.workers.celery_app flower --port=5555

  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: unless-stopped
    environment:
      TWS_USERID: ${IBKR_USERNAME:-}
      TWS_PASSWORD: ${IBKR_PASSWORD:-}
      TRADING_MODE: ${IBKR_TRADING_MODE:-paper}   # paper | live
      READ_ONLY_API: ${IBKR_READ_ONLY:-no}
      VNC_SERVER_PASSWORD: ${IBKR_VNC_PASSWORD:-changeme}
      # Accept all incoming API connections from within the Docker network
      TWOFA_TIMEOUT_ACTION: restart
    ports:
      - "127.0.0.1:4002:4002"   # paper trading API
      - "127.0.0.1:4003:4003"   # live trading API
      - "127.0.0.1:5900:5900"   # VNC — SSH tunnel to access (ssh -L 5900:localhost:5900 user@server)
    volumes:
      - ib_gateway_data:/home/ibgateway/ibgateway
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4002 || nc -z localhost 4003"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass build-time arg so Next.js bakes the correct URL into the bundle
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  bot_files:
  trade_data:
  ib_gateway_data:
